<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#dfe5e8');
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.01,50);camera.position.set(0,1.12,5.4);camera.lookAt(0,.95,0);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7efff,0x828071,2));const sun=new THREE.DirectionalLight(0xfff3e0,3);sun.position.set(-3,6,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-4;sun.shadow.camera.right=4;sun.shadow.camera.top=4;sun.shadow.camera.bottom=-4;sun.shadow.normalBias=.012;scene.add(sun);const fill=new THREE.DirectionalLight(0xc6e4ff,1.1);fill.position.set(3,2,-2);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0xd1dade,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;floor.receiveShadow=true;scene.add(floor);
const models=[],mixers=[];const old=new URLSearchParams(location.search).has('old');
for(const [i,name] of (old?['npc_exec_male','npc_exec_female']:['npc_realistic_male','npc_realistic_female','npc_realistic_male_casual']).entries()){
 const gltf=await new GLTFLoader().loadAsync('../assets/models3d/'+name+'.glb');const avatar=gltf.scene;avatar.position.x=(i-1)*1.15;avatar.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});scene.add(avatar);models.push(avatar);
 const mixer=new THREE.AnimationMixer(avatar);const idle=gltf.animations.find(a=>a.name==='Idle'),walk=gltf.animations.find(a=>a.name==='Walk');if(idle){mixer.clipAction(idle).play();mixers.push({mixer,idle,walk});}
}
let previous=performance.now(),walking=false,drag=false,lastX=0;
renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX};onpointerup=()=>drag=false;onpointermove=e=>{if(drag){models.forEach(m=>m.rotation.y+=(e.clientX-lastX)*.008);lastX=e.clientX;}};onwheel=e=>{camera.position.z=THREE.MathUtils.clamp(camera.position.z+e.deltaY*.002,1.8,8)};
onkeydown=e=>{if(e.code==='Space'){walking=!walking;mixers.forEach(({mixer,idle,walk})=>{mixer.stopAllAction();mixer.clipAction(walking?walk:idle).play()});}};
window.preview={scene,camera,renderer,models,mixers};window.ready=true;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-previous)/1000);previous=now;mixers.forEach(m=>m.mixer.update(dt));renderer.render(scene,camera)}frame(previous);
</script></html>
